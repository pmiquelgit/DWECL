<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<body>
    <!-- HACER UN CÁCLCULO CON JS Y MOSTRARLO MEDIANTE HTML-->
    <p id="parrafito"></p>

    <!-- REPASO PARA CAMBIAR IMÁGENES EN HTML MEDIANTE JS-->
    <h1>Cambio de imágenes con JavaScript</h1>
    <img id="myFPImage" onclick="cambiarPic()" src="https://media.gettyimages.com/id/2235446725/es/foto/barcelona-spain-raphinha-of-fc-barcelona-celebrates-scoring-his-teams-fourth-goal-during-the.jpg?s=594x594&w=gi&k=20&c=UgEZqQbroBua1xwvZIC-jWqdY4NJjTh1dPt1_Ln7PkQ=" width="100" height="100">
    <p>Haz click sobre las letras para cambiarlas.</p>


    <!-- CAMBIAR EL COLOR Y TAMAÑO DE UNA FUENTE MEDIANTE LA PROPIEDAD "STYLE" -->
    <p id="mytxt">Aprende JavaScript con MyFPSchool!</p>
    <button type="button" onclick="myFunction()">Dale!</button>


    <script>
        document.getElementById("parrafito").innerHTML = 5+6;
        document.write("<h2>Buenos días</h2>");
        window.alert("BUENAS NOCHES");

        function cambiarPic() {
            var image = document.getElementById('myFPImage');

            if (image.src.match("2235446725")) {
                image.src = "https://images.ecestaticos.com/3bPOU21rSG1DkFK-LfDJvV8kl-A=/0x0:2272x1515/1200x1200/filters:fill(white):format(jpg)/f.elconfidencial.com%2Foriginal%2Fa65%2Ff47%2F13f%2Fa65f4713f80f121796f2d8270948a791.jpg";
            } else {
                image.src = "https://media.gettyimages.com/id/2235446725/es/foto/barcelona-spain-raphinha-of-fc-barcelona-celebrates-scoring-his-teams-fourth-goal-during-the.jpg?s=594x594&w=gi&k=20&c=UgEZqQbroBua1xwvZIC-jWqdY4NJjTh1dPt1_Ln7PkQ=";
            }
        }


        function myFunction() {

            var x = document.getElementById("mytxt");
            x.style.fontSize = "25px";
            x.style.color = "red";


        }
    </script>




</body>
</html>
