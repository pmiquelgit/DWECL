<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Actividad 2.2</title>
    <script>

        var persona = {

            nombre: "Dimas",
            edad: 28,
            altura: 185
        }

        function mostrarPersona() {

            console.log("El usuario " + persona.nombre + " tiene " + persona.edad + " años y mide " + persona.altura + " centímetros.")
        }
    </script>
</head>
<body>
    
    <h1> Actividad 2.2 </h1>

    <p>Pulsa este botón para mostrar por consola a la persona!</p>

    <button onclick=mostrarPersona()>Mostrar persona</button>
</body>
</html>
